# Regionativo profile defaults.

theme = "regionativo"
leading = ["apple-menu", "app-menu", "omniwm", "workspaces", "scratchpads", "active-window"]
center = []
trailing = ["control-center", "system-stats", "wifi", "bluetooth", "privacy", "volume", "battery", "clock"]
hiddenBarWidget = "hidden-bar"
systemStatsWidget = "system-stats"

# The drafting sheet: grid strength, column width (pt), bottom rule (pt), ticks. fps 0 = drawn once.
[barShader]
source = "regionativo-grid.metal"
fps = 0
values = [0, 112, 1.5, 0]  # grid and ticks off: just the rule

[widgets.workspaces]
indicator = "minimal"

[workspaceBar]
autoHide = false  # explicit: OmniWM's global default here is auto-hide
position = "overlappingMenuBar"
height = 38
fullWidth = true
fullWidthNotchMode = "off"
reserveLayoutSpace = true
transparentBackground = false
backgroundOpacity = 1
# The palette paper behind the drawn background: if the shader isn't showing (displays asleep,
# wake, reload) the bar falls back to this, not to OmniWM's default (light) fill.
barFill = "background"
solidBlackBackground = false
showItemBackgrounds = false
showAccentHighlights = true
showLabels = true
hideEmptyWorkspaces = true
deduplicateAppIcons = false
windowLevel = "status"
