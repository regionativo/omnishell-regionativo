# Regionativo palette (light = paper, dark = night paper).
#   paper / ink / line / muted / faint / grid  -> background / foreground / border / secondary / muted
#   orange  #f26b1d (dark #ff9150, fill #c54e0a)  -> accent, orange, brown (burnt)
#   purple  #5b2a9e (dark #bb9cf2)                -> purple (text), indigo (the solid purple block)
# No other hues: everything else is ink on paper, like the site.

[light]
background = "#F1EDE4"
surface = "#F6F3EC"
elevatedSurface = "#E8E2D4"
foreground = "#111111"
secondaryForeground = "#5E5849"
mutedForeground = "#8A8270"
